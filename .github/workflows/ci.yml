name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, and nothing else.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck

      # `icons.d.ts` is committed so the source type-checks before the table is generated
      # (the Obsidian review lints it that way); fail if the generator would change it.
      - name: Check the committed icon types are current
        run: git diff --exit-code -- src/generated/icons.d.ts
      - run: npm test
      - run: npm run build

      - name: Report bundle size
        run: |
          size=$(stat -c%s main.js)
          echo "main.js: $((size / 1024)) KiB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt 2097152 ]; then
            echo "main.js is larger than 2 MiB ($size bytes)" >&2
            exit 1
          fi
